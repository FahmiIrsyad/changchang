<!doctype html>
<html><head><meta charset="utf-8"><title>Stage</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:'Noto Sans CJK SC',system-ui,sans-serif;color:#FFF4E8}
body{background:radial-gradient(circle at 78% 40%,#4A2318 0,#1C130E 55%,#140D09 100%)}
.cap{pointer-events:none;position:absolute;left:130px;top:0;bottom:0;width:820px;display:flex;flex-direction:column;justify-content:center;gap:22px;transition:opacity .5s}
.kicker{display:inline-block;align-self:flex-start;background:#E8453C;color:#fff;font-weight:900;font-size:22px;padding:8px 18px;border-radius:999px;letter-spacing:.5px}
.title{font-size:66px;font-weight:900;line-height:1.1;letter-spacing:-1px}
.sub{font-size:28px;line-height:1.5;color:#D9C6B3;font-weight:500}
.sub b{color:#F5C451}
.brand{transition:opacity .5s;position:absolute;left:130px;top:60px;font-size:20px;color:#A8927E;font-weight:700;display:flex;gap:12px;align-items:center}
.brand i{width:34px;height:34px;border-radius:10px;background:#E8453C;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:900}
.phone{position:absolute;right:250px;top:50%;width:430px;height:900px;transform:translateY(-50%) scale(1.06);border-radius:58px;background:#0B0806;padding:14px;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 2px #3A2A20;transition:opacity .5s, transform .6s}
.screenwrap{width:402px;height:872px;border-radius:44px;overflow:hidden;background:#FFF8F0;display:flex;flex-direction:column}
.status{height:48px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0;font-size:15px;font-weight:800;color:#22190F}
.phone iframe{width:402px;flex:1;border:0;background:#FFF8F0}
.notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#0B0806;border-radius:20px;z-index:2}
.laptop{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:1560px;height:800px;border-radius:22px;background:#0B0806;padding:12px;box-shadow:0 40px 120px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .5s}
.laptop .lwrap{width:100%;height:100%;border-radius:12px;overflow:hidden;background:#fff}
.laptop iframe{width:1280px;height:680px;border:0;transform:scale(1.13);transform-origin:0 0;background:#fff}
.band{pointer-events:none;position:absolute;left:0;right:0;bottom:0;height:200px;display:flex;align-items:center;gap:26px;padding:0 180px;opacity:0;transition:opacity .5s}
.band .title{font-size:40px}.band .sub{font-size:24px}
body.wide .cap,body.wide .brand,body.wide .phone{opacity:0;pointer-events:none}
body.wide .laptop{opacity:1;pointer-events:auto}body.wide .band{opacity:1}
.card{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;background:radial-gradient(circle at 50% 30%,#4A2318 0,#1C130E 60%)}
body.card-on .card{display:flex}
.logo{width:150px;height:150px;border-radius:44px;background:#E8453C;color:#fff;font-size:86px;font-weight:900;display:grid;place-items:center;box-shadow:0 12px 0 #B8302A}
.card h1{font-size:84px;margin:0;font-weight:900}
.card p{font-size:32px;color:#D9C6B3;margin:0;line-height:1.5}
.card .who{font-size:26px;color:#F5C451;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,330px);gap:18px;margin-top:10px}
.grid div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:22px;font-size:22px;text-align:left;line-height:1.4}
.grid b{display:block;color:#F5C451;font-size:18px;margin-bottom:6px;letter-spacing:.5px}
</style></head>
<body>
<div class="brand"><i>唱</i> ChangChang prototype · built for Kunkwan Sdn Bhd</div>
<div class="cap"><span class="kicker" id="k"></span><div class="title" id="t"></div><div class="sub" id="s"></div></div>
<div class="phone"><div class="notch"></div><div class="screenwrap"><div class="status"><span>9:41</span><span>●●● 5G ▮</span></div><iframe id="app" src="index.html#/login"></iframe></div></div>
<div class="laptop"><div class="lwrap"><iframe id="admin" src="index.html#/admin"></iframe></div></div>
<div class="band"><span class="kicker" id="k2"></span><div><div class="title" id="t2"></div><div class="sub" id="s2"></div></div></div>
<div class="card" id="card"></div>
<script>
window.setScene=function(o){
  document.body.classList.toggle('wide',!!o.wide);
  const [k,t,s]=o.wide?['k2','t2','s2']:['k','t','s'];
  document.getElementById(k).textContent=o.kicker||'';
  document.getElementById(t).innerHTML=o.title||'';
  document.getElementById(s).innerHTML=o.sub||'';
};
window.showCard=function(html){document.getElementById('card').innerHTML=html;document.body.classList.toggle('card-on',!!html)};
</script>
</body></html>
